    if (mode === 'twoplayer') {
    return { total: 0, breakdown: {}, label: '', reason: 'twoplayer' };
    }
    var points = 0;
    var breakdown = {};
    var reasons = [];
    if (mode === 'quick') {
    if (scoreLeft > scoreRight) {
    breakdown.base = cfg.quick_win;
    reasons.push('quick_win');
    } else if (scoreLeft === scoreRight) {
    breakdown.base = cfg.quick_draw;
    reasons.push('quick_draw');
    } else {
    breakdown.base = cfg.quick_loss;
    reasons.push('quick_loss');
    }
    } else if (mode === 'tournament') {
    if (scoreLeft > scoreRight) {
    breakdown.base = cfg.tournament_round_win;
    reasons.push('tournament_round_win');
    if (S.tournamentBracket && S.tournamentBracket.currentRound === 3) {
    breakdown.championship = cfg.tournament_champion;
    reasons.push('tournament_champion');
    }
    } else {
    breakdown.base = cfg.quick_loss;
    reasons.push('tournament_loss');
    }
    }
    points += breakdown.base || 0;
    points += breakdown.championship || 0;
    if (goalsScored > 0) {
    breakdown.goals = goalsScored * cfg.goal_scored;
    reasons.push(goalsScored + '_goals');
    points += breakdown.goals;
    }
    if (scoreLeft > scoreRight && scoreRight === 0) {
    breakdown.cleanSheet = cfg.clean_sheet_bonus;
    reasons.push('clean_sheet');
    points += breakdown.cleanSheet;
    }
    if (S.wasTrailing && scoreLeft > scoreRight) {

    reasons.push('comeback');

    try {

    var newTotal = currentPoints + points;

    breakdown.milestoneFirstWin = cfg.milestone_first_win;
    reasons.push('first_win_milestone');

    if (!milestones.reach200 && newTotal >= 200 && currentPoints < 200) {
    breakdown.milestone200 = cfg.milestone_reach_200;
    points += breakdown.milestone200;
    }
    if (!milestones.reach500 && newTotal >= 500 && currentPoints < 500) {
    breakdown.milestone500 = cfg.milestone_reach_500;
    points += breakdown.milestone500;
    }
    if (!milestones.reach1000 && newTotal >= 1000 && currentPoints < 1000) {

    function updatePointsAnimations(dt) {
    if (!S.floPointsAnimations || S.floPointsAnimations.length === 0) return;
    var dtS = dt / 1000;
    for (var i = S.floPointsAnimations.length - 1; i >= 0; i--) {
    var anim = S.floPointsAnimations[i];
    anim.timer += dtS;
    var progress = anim.timer / anim.totalDuration;

    anim.y -= 60 * dtS * (1 - progress / 0.4);
    }
    for (var j = 0; j < anim.particles.length; j++) {
    var p = anim.particles[j];
    p.x += p.vx;

    S.floPointsAnimations.splice(i, 1);

    }

    function drawPointsGainAnimation() {
    if (!S.floPointsAnimations || S.floPointsAnimations.length === 0) return;
    for (var i = 0; i < S.floPointsAnimations.length; i++) {
    var anim = S.floPointsAnimations[i];
    var progress = anim.timer / anim.totalDuration;
    var alpha;
    if (progress < 0.15) alpha = progress / 0.15;
    else if (progress > 0.65) alpha = 1 - (progress - 0.65) / 0.35;
    else alpha = 1;
    alpha = Math.max(0, Math.min(1, alpha));
    var sx = toScreenX(anim.x);
    var sy = toScreenY(anim.y);
    ctx.save();
    for (var j = 0; j < anim.particles.length; j++) {
    var p = anim.particles[j];
    ctx.globalAlpha = alpha * p.life * 0.7;
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.arc(sx + toScreenS(p.x), sy + toScreenS(p.y), toScreenS(p.r), 0, Math.PI * 2);
    ctx.fill();
    }
    ctx.globalAlpha = alpha;
    var glowR = toScreenS(50 + progress * 20);
    var glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, glowR);
    glow.addColorStop(0, 'rgba(255,215,0,0.18)');
    glow.addColorStop(1, 'rgba(255,215,0,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(sx, sy, glowR, 0, Math.PI * 2);
    ctx.fill();
    var coinSize = toScreenS(14);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.arc(sx - toScreenS(42), sy, coinSize, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#7B5E00';
    ctx.font = 'bold ' + toScreenS(9) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('FP', sx - toScreenS(42), sy);
    var sc = progress < 0.2 ? 0.5 + (progress / 0.2) * 0.65 : Math.max(0.85, 1.1 - progress * 0.1);
    ctx.save();
    ctx.translate(sx, sy);
    ctx.scale(sc, sc);
    ctx.shadowColor = 'rgba(0,0,0,0.55)';
    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 2;
    var fontSize = toScreenS(22);
    ctx.font = 'bold ' + fontSize + 'px system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.lineWidth = toScreenS(3);
    ctx.strokeText('+' + anim.amount + ' FP', 0, 0);
    ctx.fillStyle = '#FFD700';
    ctx.fillText('+' + anim.amount + ' FP', 0, 0);
    if (anim.label && progress < 0.7) {
    ctx.font = toScreenS(9) + 'px system-ui,sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = toScreenS(2);
    ctx.strokeText(anim.label, 0, toScreenS(18));
    ctx.fillText(anim.label, 0, toScreenS(18));
    }
    ctx.restore();
    ctx.restore();
    }
    }

    function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).catch(function() { return copyTextFallback(text); });
    }
    return copyTextFallback(text);
    }
    
    function copyTextFallback(text) {
    return new Promise(function(resolve, reject) {
    try {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    if (ok) resolve(); else reject(new Error('copy'));
    } catch(e) { reject(e); }
    });
    }

    function getTouchHitButton(touchX, touchY) {

        var btn = buttons[i];

    function simulateMatch(team1, team2) {
    var pl1 = ASSET_CONFIG.players[team1];

    var a1 = (pl1 && pl1[0]) ? (pl1[0].attack + pl1[0].defense) / 2 : 80;
    var a2 = (pl2 && pl2[0]) ? (pl2[0].attack + pl2[0].defense) / 2 : 80;
    var s1 = 0, s2 = 0;

    var r = rand(0, 1);

    }
