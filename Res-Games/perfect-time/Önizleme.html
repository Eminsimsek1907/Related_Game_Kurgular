<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfect Time</title>
</head>

<body>
  <script>
function initVLRefleksGame() {

    if (document.querySelector("#vlRefleksGame")) return;

    const prevHtmlOverflow = document.documentElement.style.overflow;

    const prevBodyOverflow = document.body.style.overflow;

    document.documentElement.style.overflow = "hidden";

    document.body.style.overflow = "hidden";

    const CONFIG = {

        ballDuration: 2400,

        speedUpPerRound: 0.84,

        targetNorm: 0.16,

        perfectHalfNorm: 0.04,

        goodHalfNorm: 0.11,

        meterRange: 0.4,

        points: {

            perfect: 100,

            good: 50,

            miss: 0

        },

        countdownDuration: 900,

        maxRounds: 3,

        betweenRoundMs: 1150

    };



    const styleEl = document.createElement("style");

    styleEl.id = "vlRefleksGameStyle";

    styleEl.textContent = `

#vlRefleksGame {

    position: fixed;

    inset: 0;

    z-index: 999999;

    font-size: clamp(14px, 3.5vw, 18px);

    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

    overflow: hidden;

    box-sizing: border-box;

    overscroll-behavior: none;

}

#vlRefleksGame *,

#vlRefleksGame *::before,

#vlRefleksGame *::after {

    box-sizing: border-box;

}

#vlRefleksGame[data-state="open"] {

    animation: vlRgOverlayIn 0.4s ease forwards;

}

#vlRefleksGame[data-state="closing"] {

    animation: vlRgOverlayOut 0.35s ease forwards;

    pointer-events: none;

}

@keyframes vlRgOverlayIn {

    from {

        opacity: 0;

    }

    to {

        opacity: 1;

    }

}

@keyframes vlRgOverlayOut {

    to {

        opacity: 0;

    }

}

#vlRefleksGame .vl-rg-screen {

    position: absolute;

    inset: 0;

    opacity: 0;

    pointer-events: none;

    transform: translate3d(0.6em, 0, 0);

    transition: none;

    will-change: opacity, transform;

}

#vlRefleksGame[data-screen="welcome"] .vl-rg-screen-welcome,

#vlRefleksGame[data-screen="countdown"] .vl-rg-screen-countdown,

#vlRefleksGame[data-screen="game"] .vl-rg-screen-game,

#vlRefleksGame[data-screen="result"] .vl-rg-screen-result {

    animation: vlRgScreenEnter 0.4s ease forwards;

    pointer-events: auto;

}

@keyframes vlRgScreenEnter {

    from {

        opacity: 0;

        transform: translate3d(0.45em, 0, 0);

    }

    to {

        opacity: 1;

        transform: translate3d(0, 0, 0);

    }

}

#vlRefleksGame[data-screen="welcome"] .vl-rg-screen:not(.vl-rg-screen-welcome),

#vlRefleksGame[data-screen="countdown"] .vl-rg-screen:not(.vl-rg-screen-countdown),

#vlRefleksGame[data-screen="game"] .vl-rg-screen:not(.vl-rg-screen-game),

#vlRefleksGame[data-screen="result"] .vl-rg-screen:not(.vl-rg-screen-result) {

    animation: vlRgScreenLeave 0.3s ease forwards;

}

@keyframes vlRgScreenLeave {

    to {

        opacity: 0;

        transform: translate3d(-0.4em, 0, 0);

    }

}

.vl-rg-welcome-inner {

    min-height: 100%;

    padding: 1.2em;

    padding-bottom: max(1.2em, env(safe-area-inset-bottom, 0px));

    background: radial-gradient(ellipse 70% 40% at 15% 0%, rgba(255, 233, 160, 0.16), transparent 70%), radial-gradient(ellipse 70% 40% at 85% 0%, rgba(255, 233, 160, 0.16), transparent 70%), radial-gradient(ellipse 120% 60% at 50% 110%, rgba(31, 122, 58, 0.45), transparent 70%), linear-gradient(165deg, #0d1528 0%, #070b1f 50%, #160f33 100%);

    color: #f0f4ff;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: flex-start;

    overflow-y: auto;

    -webkit-overflow-scrolling: touch;

}

.vl-rg-hero {

    width: 7.5em;

    height: 5em;

    margin-top: 0.6em;

    flex-shrink: 0;

    filter: drop-shadow(0 0.4em 0.8em rgba(0, 0, 0, 0.5));

    animation: vlRgHeroFloat 2.6s ease-in-out infinite;

}

@keyframes vlRgHeroFloat {

    0%,

    100% {

        transform: translate3d(0, 0, 0) rotate(-2deg);

    }

    50% {

        transform: translate3d(0, -0.35em, 0) rotate(2deg);

    }

}

.vl-rg-x {

    appearance: none;

    position: absolute;

    top: max(0.7em, env(safe-area-inset-top, 0px));

    right: 0.7em;

    z-index: 50;

    width: 2.4em;

    height: 2.4em;

    padding: 0;

    border-radius: 50%;

    border: 0.1em solid rgba(255, 255, 255, 0.25);

    background: rgba(0, 0, 0, 0.4);

    color: #fff;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    touch-action: manipulation;

    transition: transform 0.15s ease, opacity 0.15s ease;

}

.vl-rg-x:active {

    transform: scale(0.92);

}

.vl-rg-x svg {

    width: 0.95em;

    height: 0.95em;

}

.vl-rg-title {

    font-weight: 800;

    font-size: 1.35em;

    letter-spacing: 0.06em;

    text-transform: uppercase;

    margin: 0.5em 0 0.2em;

    text-align: center;

}

.vl-rg-sub {

    font-weight: 700;

    font-size: 0.95em;

    text-transform: uppercase;

    color: #00ff88;

    margin: 0 0 1em;

    text-align: center;

    animation: vlRgBlink 1.1s ease-in-out infinite;

}

@keyframes vlRgBlink {

    0%,

    100% {

        opacity: 1;

    }

    50% {

        opacity: 0.35;

    }

}

.vl-rg-diagram {

    width: 100%;

    max-width: 22em;

    height: 5.5em;

    margin: 0.5em auto 1em;

    position: relative;

    border-radius: 0.5em;

    background: rgba(0, 0, 0, 0.35);

    overflow: hidden;

}

.vl-rg-dia-bat-wrap {

    position: absolute;

    left: 0.8em;

    top: 50%;

    transform: translateY(-50%);

    width: 3.2em;

    height: 4em;

}

.vl-rg-dia-zone {

    position: absolute;

    left: 0.2em;

    top: 50%;

    width: 2.8em;

    height: 3.2em;

    transform: translateY(-50%);

    border-radius: 0.35em;

    border: 0.1em solid #ffd700;

    box-shadow: 0 0 0.6em #ffd700, 0 0 1.2em rgba(0, 255, 136, 0.5);

    animation: vlRgDiaGlow 1.2s ease-in-out infinite;

    opacity: 0.85;

}

@keyframes vlRgDiaGlow {

    0%,

    100% {

        opacity: 0.7;

        transform: translateY(-50%) scale(1);

    }

    50% {

        opacity: 1;

        transform: translateY(-50%) scale(1.05);

    }

}

.vl-rg-dia-bat {

    position: absolute;

    left: 1.2em;

    top: 0.4em;

    width: 0.45em;

    height: 3.2em;

    background: linear-gradient(90deg, #4a3728, #8b6914);

    border-radius: 0.15em;

    transform-origin: 50% 90%;

    transform: rotate(-18deg);

}

.vl-rg-dia-ball {

    position: absolute;

    top: 50%;

    right: 0.5em;

    width: 0.85em;

    height: 0.85em;

    margin-top: -0.425em;

    border-radius: 50%;

    background: radial-gradient(circle at 30% 30%, #fff, #eef2f7 45%, #9aa3b2);

    border-left: 0.08em dashed #e11d48;

    border-right: 0.08em dashed #e11d48;

    box-shadow: 0 0.15em 0.35em rgba(0, 0, 0, 0.45), 0.6em 0 0.6em -0.3em rgba(255, 255, 255, 0.35);

    animation: vlRgDiaBall 2.4s linear infinite;

}

@keyframes vlRgDiaBall {

    0% {

        transform: translateX(0) scaleY(1);

    }

    12% {

        transform: translateX(-2em) scaleY(0.92);

    }

    70% {

        transform: translateX(-13.5em) scaleY(1);

    }

    88% {

        transform: translateX(-16em) scaleY(0.92);

    }

    100% {

        transform: translateX(-18em) scaleY(1);

    }

}

.vl-rg-instructions {

    width: 100%;

    max-width: 24em;

    list-style: none;

    padding: 0;

    margin: 0 0 1em;

}

.vl-rg-instructions li {

    display: flex;

    align-items: flex-start;

    gap: 0.5em;

    font-size: 0.88em;

    font-weight: 600;

    margin-bottom: 0.55em;

    line-height: 1.35;

}

.vl-rg-tiers {

    display: flex;

    flex-direction: column;

    gap: 0.5em;

    width: 100%;

    max-width: 24em;

    margin-bottom: 1.2em;

}

.vl-rg-tier {

    border-radius: 0.45em;

    padding: 0.55em 0.75em;

    font-weight: 800;

    font-size: 0.82em;

    text-transform: uppercase;

    letter-spacing: 0.03em;

    border: 0.12em solid;

}

.vl-rg-tier-gold {

    background: linear-gradient(135deg, rgba(255, 215, 0, 0.25), rgba(80, 60, 0, 0.4));

    border-color: #ffd700;

    color: #ffe566;

}

.vl-rg-tier-silver {

    background: linear-gradient(135deg, rgba(192, 192, 192, 0.2), rgba(60, 60, 70, 0.45));

    border-color: #c0c0c0;

    color: #e8e8ec;

}

.vl-rg-tier-miss {

    background: linear-gradient(135deg, rgba(180, 60, 60, 0.2), rgba(40, 30, 30, 0.5));

    border-color: #884444;

    color: #c8a8a8;

}

.vl-rg-btn-primary {

    appearance: none;

    border: none;

    cursor: pointer;

    font-weight: 800;

    font-size: 1.05em;

    text-transform: uppercase;

    letter-spacing: 0.05em;

    padding: 0.85em 1.8em;

    border-radius: 0.5em;

    background: linear-gradient(180deg, #00ff88, #00c266);

    color: #041208;

    box-shadow: 0 0.35em 1em rgba(0, 255, 136, 0.35);

    transform: translateZ(0);

    transition: transform 0.15s ease, opacity 0.15s ease;

    touch-action: manipulation;

}

.vl-rg-btn-primary:active {

    transform: scale(0.97);

}

.vl-rg-count-inner {

    min-height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    background: radial-gradient(ellipse at center, #1a2040 0%, #0a0a0f 70%);

    color: #fff;

}

.vl-rg-count-num {

    position: absolute;

    font-weight: 900;

    font-size: 5em;

    text-transform: uppercase;

    opacity: 0;

    pointer-events: none;

    text-shadow: 0 0 0.5em rgba(0, 255, 136, 0.4);

}

.vl-rg-count-num[data-phase="show"] {

    animation: vlRgCountPop 0.85s ease forwards;

}

@keyframes vlRgCountPop {

    0% {

        opacity: 0;

        transform: scale(0.4);

    }

    35% {

        opacity: 1;

        transform: scale(1.15);

    }

    100% {

        opacity: 0;

        transform: scale(1.6);

    }

}

.vl-rg-game-inner {

    height: 100%;

    background: #070b1f;

    color: #eee;

    display: flex;

    flex-direction: column;

    padding: 1em 1em max(1.2em, calc(0.6em + env(safe-area-inset-bottom, 0px)));

    position: relative;

    overflow: hidden;

    touch-action: manipulation;

    user-select: none;

    -webkit-user-select: none;

    -webkit-tap-highlight-color: transparent;

}

.vl-rg-game-inner[data-shake="on"] {

    animation: vlRgShake 0.42s ease both;

}

@keyframes vlRgShake {

    0%,

    100% {

        transform: translate3d(0, 0, 0);

    }

    20% {

        transform: translate3d(-0.32em, 0.16em, 0);

    }

    40% {

        transform: translate3d(0.3em, -0.16em, 0);

    }

    60% {

        transform: translate3d(-0.2em, 0.1em, 0);

    }

    80% {

        transform: translate3d(0.14em, 0, 0);

    }

}

.vl-rg-stadium {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    z-index: 0;

    pointer-events: none;

}

.vl-rg-stadium-light {

    animation: vlRgLightFlicker 3.2s ease-in-out infinite;

}

@keyframes vlRgLightFlicker {

    0%,

    100% {

        opacity: 1;

    }

    50% {

        opacity: 0.75;

    }

}

.vl-rg-game-hud {

    position: relative;

    z-index: 1;

    padding-right: 3em;

    display: flex;

    flex-wrap: wrap;

    align-items: center;

    justify-content: space-between;

    gap: 0.65em;

    margin-bottom: 0.35em;

    flex-shrink: 0;

}

.vl-rg-game-hud-pill {

    font-weight: 800;

    font-size: 0.78em;

    text-transform: uppercase;

    letter-spacing: 0.06em;

    padding: 0.45em 0.75em;

    border-radius: 2em;

    background: rgba(0, 255, 136, 0.12);

    border: 0.1em solid rgba(0, 255, 136, 0.35);

    color: #00ff88;

}

.vl-rg-game-hud-stats {

    display: flex;

    align-items: center;

    gap: 0.5em;

    flex-wrap: wrap;

}

.vl-rg-game-hud-lives {

    display: flex;

    gap: 0.28em;

}

.vl-rg-game-life {

    width: 0.65em;

    height: 0.65em;

    border-radius: 50%;

    background: rgba(255, 255, 255, 0.2);

    border: 0.1em solid rgba(255, 255, 255, 0.35);

    transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;

}

.vl-rg-game-life[data-used="true"] {

    background: rgba(255, 80, 80, 0.35);

    border-color: rgba(255, 120, 120, 0.55);

    transform: scale(0.85);

}

.vl-rg-game-life[data-current="true"] {

    background: rgba(0, 255, 136, 0.35);

    border-color: #00ff88;

    box-shadow: 0 0 0.5em rgba(0, 255, 136, 0.4);

}

.vl-rg-game-life[data-result="perfect"] {

    background: #ffd700;

    border-color: #fff3b0;

    box-shadow: 0 0 0.5em rgba(255, 215, 0, 0.7);

    transform: scale(1);

}

.vl-rg-game-life[data-result="good"] {

    background: #34d399;

    border-color: #a7f3d0;

    transform: scale(1);

}

.vl-rg-game-life[data-result="miss"] {

    background: #ef4444;

    border-color: #fca5a5;

}

.vl-rg-game-hud-score {

    font-weight: 900;

    font-size: 0.78em;

    letter-spacing: 0.06em;

    padding: 0.45em 0.75em;

    border-radius: 2em;

    background: rgba(255, 215, 0, 0.14);

    border: 0.1em solid rgba(255, 215, 0, 0.45);

    color: #ffe566;

    white-space: nowrap;

}

.vl-rg-game-hud-score[data-bump="on"] {

    animation: vlRgBump 0.45s ease;

}

@keyframes vlRgBump {

    0%,

    100% {

        transform: scale(1);

    }

    40% {

        transform: scale(1.25);

    }

}

.vl-rg-game-toast {

    position: absolute;

    left: 50%;

    top: 20%;

    z-index: 20;

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 0.1em;

    padding: 0.45em 1.4em 0.55em;

    border-radius: 1em;

    text-align: center;

    white-space: nowrap;

    pointer-events: none;

    opacity: 0;

    transform: translate3d(-50%, 0, 0);

}

.vl-rg-game-toast[data-show="true"] {

    animation: vlRgToastPop 1.05s cubic-bezier(0.2, 0.9, 0.3, 1.2) forwards;

}

@keyframes vlRgToastPop {

    0% {

        opacity: 0;

        transform: translate3d(-50%, 0.6em, 0) scale(0.4);

    }

    18% {

        opacity: 1;

        transform: translate3d(-50%, 0, 0) scale(1.18);

    }

    32% {

        opacity: 1;

        transform: translate3d(-50%, 0, 0) scale(1);

    }

    75% {

        opacity: 1;

        transform: translate3d(-50%, -0.3em, 0) scale(1);

    }

    100% {

        opacity: 0;

        transform: translate3d(-50%, -1.2em, 0) scale(0.95);

    }

}

.vl-rg-toast-main {

    font-weight: 900;

    font-size: 1.7em;

    letter-spacing: 0.06em;

    line-height: 1.1;

}

.vl-rg-toast-sub {

    font-weight: 800;

    font-size: 0.78em;

    letter-spacing: 0.1em;

    text-transform: uppercase;

    opacity: 0.92;

}

.vl-rg-game-toast[data-tier="perfect"] {

    background: radial-gradient(ellipse at center, rgba(120, 85, 0, 0.75), rgba(40, 28, 0, 0.75));

    color: #ffe566;

    border: 0.12em solid #ffd700;

    text-shadow: 0 0 0.4em rgba(255, 215, 0, 0.8), 0 0.08em 0 #a16207;

    box-shadow: 0 0 1.4em rgba(255, 215, 0, 0.45);

}

.vl-rg-game-toast[data-tier="good"] {

    background: rgba(6, 60, 40, 0.75);

    color: #6ee7b7;

    border: 0.12em solid #34d399;

    text-shadow: 0 0 0.35em rgba(52, 211, 153, 0.7);

}

.vl-rg-game-toast[data-tier="miss"] {

    background: rgba(70, 15, 20, 0.75);

    color: #fca5a5;

    border: 0.12em solid #ef4444;

}

.vl-rg-field {

    flex: 1;

    position: relative;

    z-index: 1;

    display: flex;

    align-items: center;

    width: 100%;

    max-width: 30em;

    margin: 0 auto;

    min-height: 14em;

}

.vl-rg-batter {

    position: relative;

    width: 7em;

    height: 11em;

    flex-shrink: 0;

    z-index: 2;

}

.vl-rg-batter-svg {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    overflow: visible;

}

.vl-rg-bat-wrap {

    position: absolute;

    left: 4.2em;

    top: 5.5em;

    width: 0;

    height: 0;

    transform-origin: 0 0;

    transform: rotate(-32deg);

}

.vl-rg-bat-wrap[data-state="swinging"] {

    animation: vlRgBatSwing 0.62s ease-out forwards;

}

@keyframes vlRgBatSwing {

    0% {

        transform: rotate(-32deg);

    }

    16% {

        transform: rotate(98deg);

    }

    42% {

        transform: rotate(150deg);

    }

    100% {

        transform: rotate(-32deg);

    }

}

.vl-rg-sweet {

    position: absolute;

    left: -0.5em;

    bottom: 3.3em;

    width: 1em;

    height: 2em;

    border-radius: 0.5em;

    background: radial-gradient(ellipse at center, rgba(255, 215, 0, 0.45), rgba(255, 215, 0, 0) 70%);

    box-shadow: 0 0 0.6em rgba(255, 215, 0, 0.45);

    animation: vlRgSweetPulse 0.9s ease-in-out infinite;

}

@keyframes vlRgSweetPulse {

    0%,

    100% {

        opacity: 0.9;

        transform: scale(1);

    }

    50% {

        opacity: 1;

        transform: scale(1.07);

    }

}

.vl-rg-bat {

    position: absolute;

    left: -0.5em;

    bottom: -0.45em;

    width: 1em;

    height: 5.6em;

    filter: drop-shadow(0 0.15em 0.2em rgba(0, 0, 0, 0.45));

}

.vl-rg-bat svg {

    display: block;

    width: 100%;

    height: 100%;

}

.vl-rg-ball-track {

    position: absolute;

    left: 6.2em;

    right: 0.5em;

    top: 50%;

    height: 3em;

    margin-top: -1.5em;

    border-radius: 1.5em;

    background: linear-gradient(180deg, rgba(10, 14, 35, 0.6), rgba(10, 14, 35, 0.82));

    border: 0.08em solid rgba(255, 255, 255, 0.14);

    box-shadow: inset 0 0 0.8em rgba(0, 0, 0, 0.55), 0 0.3em 1em rgba(0, 0, 0, 0.35);

}

.vl-rg-track-barem {

    position: absolute;

    left: 0;

    top: 0;

    right: 0;

    bottom: 0;

    pointer-events: none;

    z-index: 1;

}

.vl-rg-track-barem-good {

    position: absolute;

    left: ${((CONFIG.targetNorm - CONFIG.goodHalfNorm) * 100).toFixed(2)}%;

    top: 0.25em;

    bottom: 0.25em;

    width: ${(CONFIG.goodHalfNorm * 200).toFixed(2)}%;

    border-radius: 0.7em;

    background: linear-gradient(180deg, rgba(52, 211, 153, 0.38), rgba(16, 185, 129, 0.16));

    border: 0.08em solid rgba(52, 211, 153, 0.65);

}

.vl-rg-track-barem-perfect {

    position: absolute;

    left: ${((CONFIG.targetNorm - CONFIG.perfectHalfNorm) * 100).toFixed(2)}%;

    top: 0.08em;

    bottom: 0.08em;

    width: ${(CONFIG.perfectHalfNorm * 200).toFixed(2)}%;

    border-radius: 0.5em;

    background: linear-gradient(180deg, rgba(255, 230, 102, 0.8), rgba(234, 179, 8, 0.45));

    border: 0.1em solid #ffd700;

    box-shadow: 0 0 0.8em rgba(255, 215, 0, 0.55);

    animation: vlRgBaremPulse 1.1s ease-in-out infinite;

}

.vl-rg-track-barem-line {

    position: absolute;

    left: ${(CONFIG.targetNorm * 100).toFixed(2)}%;

    top: -0.45em;

    bottom: -0.45em;

    width: 0.14em;

    margin-left: -0.07em;

    border-radius: 0.1em;

    background: #fff;

    box-shadow: 0 0 0.45em #fff, 0 0 0.9em rgba(255, 215, 0, 0.8);

}

.vl-rg-ball-track[data-zone="good"] .vl-rg-track-barem-good {

    background: linear-gradient(180deg, rgba(52, 211, 153, 0.6), rgba(16, 185, 129, 0.3));

    box-shadow: 0 0 1em rgba(52, 211, 153, 0.6);

}

.vl-rg-ball-track[data-zone="perfect"] .vl-rg-track-barem-perfect {

    animation: none;

    box-shadow: 0 0 1.4em rgba(255, 215, 0, 0.95), 0 0 0.4em #fff;

}

.vl-rg-ball-track[data-zone="perfect"] .vl-rg-track-barem-good {

            miss: () => tone(220, 0.38, { type: "sawtooth", vol: 0.12, to: 100 }),

            win: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.3, { type: "triangle", vol: 0.2, delay: i * 0.11 })),

            lose: () => [392, 330, 262].forEach((f, i) => tone(f, 0.32, { type: "sine", vol: 0.18, delay: i * 0.17 })),

            close: () => {

                if (!ctx) return;

                try {

                    ctx.close().catch(() => {});

                } catch {}

                ctx = null;

            }

        };

    })();



    let rafId = null;

    let gameStart = 0;

    let settled = false;

    let inputAbort = null;

    let roundIndex = 0;

    let score = 0;

    let pitchDuration = CONFIG.ballDuration;

    const sessionTiers = [];

    let betweenRoundTimer = null;

    let countdownTimer = null;

    let resizeRaf = null;

    const metrics = {

        trackW: 0,

        ballW: 0,

        barW: 0

    };



    const clearBetweenRound = () => {

        if (betweenRoundTimer !== null) {

            clearTimeout(betweenRoundTimer);

            betweenRoundTimer = null;

        }

    };



    const clearCountdown = () => {

        if (countdownTimer !== null) {

            clearTimeout(countdownTimer);

            countdownTimer = null;

        }

    };



    const clearGameLoop = () => {

        if (rafId !== null) {

            cancelAnimationFrame(rafId);

            rafId = null;

        }

    };



    const teardownGameInput = () => {

        if (inputAbort) {

            inputAbort.abort();

            inputAbort = null;

        }

    };



    const buildLives = () => {

        livesRow.innerHTML = "";

        for (let i = 0; i < CONFIG.maxRounds; i++) {

            const d = document.createElement("div");

            d.className = "vl-rg-game-life";

            d.dataset.used = "false";

            d.dataset.current = i === 0 ? "true" : "false";

            livesRow.appendChild(d);

        }

    };



    const updateHud = () => {

        roundPill.textContent = `${roundIndex + 1} / ${CONFIG.maxRounds} ATIŞ`;

        const nodes = livesRow.querySelectorAll(".vl-rg-game-life");

        nodes.forEach((node, i) => {

            node.dataset.current = i === roundIndex && i >= sessionTiers.length ? "true" : "false";

            node.dataset.used = i < roundIndex ? "true" : "false";

            node.dataset.result = sessionTiers[i] || "";

        });

        scorePill.textContent = `${score} PUAN`;

    };



    const restartAnim = (el, key) => {

        el.dataset[key] = "off";

        void el.offsetWidth;

        el.dataset[key] = "on";

    };



    const showToast = (tier, timing, points) => {

        const labels = {

            perfect: "MÜKEMMEL!",

            good: "İYİ VURUŞ!",

            miss: "KAÇTI!"

        };

        const sub = tier === "miss" ? (timing === "early" ? "Çok erken" : "Çok geç") : `+${points} puan`;

        toastEl.dataset.tier = tier;

        toastEl.innerHTML = `<span class="vl-rg-toast-main">${labels[tier]}</span><span class="vl-rg-toast-sub">${sub}</span>`;

        toastEl.dataset.show = "false";

        void toastEl.offsetWidth;

        toastEl.dataset.show = "true";

    };



    const measure = () => {

        metrics.trackW = ballTrack.clientWidth;

        metrics.ballW = gameBall.offsetWidth;

        metrics.barW = meterBar.clientWidth;

    };



    const offsetAt = (progress) => 1 - progress - CONFIG.targetNorm;

    const meterPosAt = (progress) => Math.min(1, Math.max(0, 0.5 + offsetAt(progress) / (2 * CONFIG.meterRange)));



    const tierFromProgress = (progress) => {

        const d = Math.abs(offsetAt(progress));

        if (d <= CONFIG.perfectHalfNorm) return "perfect";

        if (d <= CONFIG.goodHalfNorm) return "good";

        return "miss";

    };



    const ballXAt = (progress) => metrics.trackW * (1 - progress) - metrics.ballW / 2;



    const placeBall = (progress) => {

        gameBall.style.transform = `translate3d(${ballXAt(progress).toFixed(1)}px,0,0)`;

        meterNeedle.style.transform = `translate3d(${(meterPosAt(progress) * metrics.barW).toFixed(1)}px,0,0)`;

        const zone = tierFromProgress(progress);

        if (ballTrack.dataset.zone !== zone) ballTrack.dataset.zone = zone;

    };



    const addMark = (progress, tier) => {

        const mark = document.createElement("div");

        mark.className = "vl-rg-meter-mark";

        mark.dataset.tier = tier;

        mark.style.left = `${(meterPosAt(progress) * 100).toFixed(2)}%`;

        meterMarks.appendChild(mark);

    };



    const burstSparks = (tier, progress) => {

        const host = document.createElement("div");

        host.className = "vl-rg-sparks";

        host.dataset.tier = tier;

        host.style.left = `${(metrics.trackW * (1 - progress)).toFixed(1)}px`;

        const n = tier === "perfect" ? 16 : 9;

        for (let i = 0; i < n; i++) {

            const s = document.createElement("div");

            s.className = "vl-rg-spark";

            const ang = (i / n) * Math.PI * 2;

            const dist = (tier === "perfect" ? 3.2 : 2.2) + (i % 3) * 0.6;

            s.style.setProperty("--tx", `${(Math.cos(ang) * dist).toFixed(2)}em`);

            s.style.setProperty("--ty", `${(Math.sin(ang) * dist).toFixed(2)}em`);

            host.appendChild(s);

        }

        ballTrack.appendChild(host);

        window.setTimeout(() => host.remove(), 750);

    };



    const buildFx = (kind) => {

        fxLayer.innerHTML = "";

        if (kind === "miss") {

            const mb = document.createElement("div");

            mb.className = "vl-rg-miss-ball";

            fxLayer.appendChild(mb);

            return;

        }

        const n = kind === "perfect" ? 30 : 18;

        for (let i = 0; i < n; i++) {

            const p = document.createElement("div");

            p.className = "vl-rg-particle";

            const ang = (i / n) * Math.PI * 2;

            const dist = kind === "perfect" ? 8 + (i % 5) : 6 + (i % 4);

            p.style.setProperty("--tx", `${Math.cos(ang) * dist}em`);

            p.style.setProperty("--ty", `${Math.sin(ang) * dist - 2}em`);

            p.style.animationDelay = `${(i * 0.03).toFixed(2)}s`;

            fxLayer.appendChild(p);

        }

    };



    const resetSession = () => {

        sessionTiers.length = 0;

        roundIndex = 0;

        score = 0;

        meterMarks.innerHTML = "";

        toastEl.dataset.show = "false";

        gameBall.dataset.hit = "";

        gameBall.dataset.travel = "off";

        ballTrack.dataset.zone = "";

        ballTrack.querySelectorAll(".vl-rg-sparks").forEach((s) => s.remove());

        batWrap.dataset.state = "";

        buildLives();

        updateHud();

    };



    const hitCountFromSession = () => sessionTiers.filter((t) => t === "perfect" || t === "good").length;

    const hitPercent = () => Math.round((hitCountFromSession() / CONFIG.maxRounds) * 100);



    const showSummaryResult = () => {

        settled = true;

        clearGameLoop();

        teardownGameInput();

        clearBetweenRound();

        gameBall.dataset.travel = "off";

        const pct = hitPercent();

        const perfectN = sessionTiers.filter((t) => t === "perfect").length;

        const goodN = sessionTiers.filter((t) => t === "good").length;

        const missN = sessionTiers.filter((t) => t === "miss").length;

        breakdownEl.hidden = false;

        breakdownEl.innerHTML = `

<span><span>İsabet</span><span>%${pct}</span></span>

<span><span>Mükemmel</span><span>${perfectN}</span></span>

<span><span>İyi</span><span>${goodN}</span></span>

<span><span>Kaçan</span><span>${missN}</span></span>

<span><span>Toplam puan</span><span>${score}</span></span>

`;

        let title = "BU SEFER OLMADI";

        let sub = `${CONFIG.maxRounds} atıştan ${hitCountFromSession()} isabetli vuruş. Bir daha dene!`;

        let code = "TEKRARDENE";

        if (pct >= 67) {

            title = "ŞİDDETLİ İSABET!";

            sub = `%${pct} isabet — %30 İndirim kazandın!`;

            code = "MUKEMMEL30";

        } else if (pct >= 33) {

            title = "İDARE EDER!";

            sub = `%${pct} isabet — %15 İndirim kazandın!`;

            code = "IYI15";

        }

        resultScreen.dataset.result = "summary";

        if (pct >= 67) resultScreen.dataset.grade = "high";

        else if (pct >= 33) resultScreen.dataset.grade = "mid";

        else resultScreen.dataset.grade = "low";

        resTitle.textContent = title;

        resSub.textContent = sub;

        couponCode.textContent = code;

        copyBtn.dataset.copied = "false";

        copyBtn.textContent = "KODU KOPYALA";

        const fxKind = pct >= 67 ? "perfect" : pct >= 33 ? "good" : "miss";

        buildFx(fxKind);

        if (fxKind === "miss") sfx.lose();

        else sfx.win();

        elScreen("result");

    };



    const finishMiss = () => {

        if (settled) return;

        addMark(1, "miss");

        completeRound("miss", "late", 1);

    };



    const resolveHit = (progress) => {

        if (settled) return;

        const tier = tierFromProgress(progress);

        restartAnim(batWrap, "state");

        batWrap.dataset.state = "swinging";

        sfx.swing();

        placeBall(progress);

        addMark(progress, tier);

        completeRound(tier, offsetAt(progress) > 0 ? "early" : "late", progress);

    };



    const completeRound = (tier, timing, progress) => {

        settled = true;

        clearGameLoop();

        teardownGameInput();

        gameBall.dataset.travel = "off";

        gameBall.dataset.hit = tier;

        ballTrack.dataset.zone = "";

        const points = CONFIG.points[tier];

        score += points;

        sessionTiers.push(tier);

        showToast(tier, timing, points);

        updateHud();

        if (tier === "miss") {

            sfx.miss();

        } else {

            burstSparks(tier, progress);

            restartAnim(scorePill, "bump");

            if (tier === "perfect") {

                sfx.perfect();

                restartAnim(gameInner, "shake");

            } else {

                sfx.good();

            }

        }

        if (sessionTiers.length >= CONFIG.maxRounds) {

            clearBetweenRound();

            betweenRoundTimer = window.setTimeout(() => {

                showSummaryResult();

            }, CONFIG.betweenRoundMs + 200);

            return;

        }

        clearBetweenRound();

        betweenRoundTimer = window.setTimeout(() => {

            roundIndex = sessionTiers.length;

            updateHud();

            startPitch();

        }, CONFIG.betweenRoundMs);

    };



    const gameLoop = (now) => {

        if (settled) return;

        const progress = Math.max(0, (now - gameStart) / pitchDuration);

        if (progress >= 1) {

            placeBall(1);

            finishMiss();

            return;

        }

        placeBall(progress);

        rafId = requestAnimationFrame(gameLoop);

    };



    const startPitch = () => {

        settled = false;

        pitchDuration = Math.round(CONFIG.ballDuration * Math.pow(CONFIG.speedUpPerRound, roundIndex));

        batWrap.dataset.state = "";

        gameBall.dataset.hit = "";

        gameBall.dataset.travel = "on";

        measure();

        placeBall(0);

        gameStart = performance.now();

        clearGameLoop();

        rafId = requestAnimationFrame(gameLoop);

        teardownGameInput();

        inputAbort = new AbortController();

        const sig = inputAbort.signal;



        const tryHit = () => {

            if (settled) return;

            resolveHit(Math.min(1, (performance.now() - gameStart) / pitchDuration));

        };



        gameInner.addEventListener(

            "pointerdown",

            (ev) => {

                if (ev.button > 0) return;

                tryHit();

            },

            { signal: sig }

        );



        window.addEventListener(

            "keydown",

            (ev) => {

                if (ev.code !== "Space" && ev.key !== " " && ev.key !== "Enter") return;

                ev.preventDefault();

                if (ev.repeat) return;

                tryHit();

            },

            { signal: sig }

        );

    };



    const startGameplay = () => {

        if (document.activeElement && overlay.contains(document.activeElement)) document.activeElement.blur();

        startPitch();

    };



    const runCountdown = () => {

        clearCountdown();

        clearBetweenRound();

        clearGameLoop();

        teardownGameInput();

        resetSession();

        elScreen("countdown");

        countNums.forEach((n) => {

            n.removeAttribute("data-phase");

            void n.offsetWidth;

        });

        const showStep = (idx) => {

            if (idx >= countNums.length) {

                countdownTimer = null;

                elScreen("game");

                startGameplay();

                return;

            }

            const node = countNums[idx];

            node.removeAttribute("data-phase");

            void node.offsetWidth;

            node.dataset.phase = "show";

            if (idx === countNums.length - 1) sfx.go();

            else sfx.count();

            countdownTimer = window.setTimeout(() => {

                node.removeAttribute("data-phase");

                showStep(idx + 1);

            }, CONFIG.countdownDuration);

        };

        countdownTimer = window.setTimeout(() => showStep(0), 50);

    };



    const onResize = () => {

        if (resizeRaf !== null) return;

        resizeRaf = requestAnimationFrame(() => {

            resizeRaf = null;

            measure();

        });

    };



    const closeGame = () => {

        if (overlay.dataset.state === "closing") return;

        clearCountdown();

        clearBetweenRound();

        clearGameLoop();

        teardownGameInput();

        if (resizeRaf !== null) {

            cancelAnimationFrame(resizeRaf);

            resizeRaf = null;

        }

        window.removeEventListener("resize", onResize);

        overlay.dataset.state = "closing";

    };



    startBtn.addEventListener(

        "click",

        () => {

            sfx.unlock();

            sfx.click();

            try {

                const _vlc = "<%VLSendClickFunc%>";

                if (_vlc.indexOf("<%") === -1) {

                    new Function(_vlc)();

                }

            } catch {}

            runCountdown();

        },

        { once: true }

    );



    replayBtn.addEventListener("click", () => {

        if (overlay.dataset.screen !== "result") return;

        sfx.click();

        runCountdown();

    });



    copyBtn.addEventListener("click", () => {

        const code = couponCode.textContent;

        const done = () => {

            copyBtn.dataset.copied = "true";

            copyBtn.textContent = "KOPYALANDI ✓";

            sfx.click();

        };

        const fallback = () => {

            const ta = document.createElement("textarea");

            ta.value = code;

            ta.setAttribute("readonly", "");

            ta.className = "vl-rg-copy-ta";

            overlay.appendChild(ta);

            ta.select();

            try {

                document.execCommand("copy");

            } catch {}

            ta.remove();

            done();

        };

        if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(code).then(done, fallback);

        else fallback();

    });



    closeBtn.addEventListener("click", closeGame);

    xBtn.addEventListener("click", closeGame);

    window.addEventListener("resize", onResize);



    overlay.addEventListener("animationend", (ev) => {

        if (ev.target === batWrap && ev.animationName === "vlRgBatSwing") {

            batWrap.dataset.state = "";

            return;

        }

        if (overlay.dataset.state === "closing" && ev.animationName === "vlRgOverlayOut") {

            document.documentElement.style.overflow = prevHtmlOverflow;

            document.body.style.overflow = prevBodyOverflow;

            sfx.close();

            overlay.remove();

            styleEl.remove();

        }

    });



    try {

        const _vli = "<%VLSendImpressionFunc%>";

        if (_vli.indexOf("<%") === -1) {

            new Function(_vli)();

        }

    } catch {}

}



initVLRefleksGame();
  </script>
</body>

</html>
