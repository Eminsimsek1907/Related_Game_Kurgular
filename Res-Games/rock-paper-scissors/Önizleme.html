const handAltFor = (type) => {
  if (type === "rock") return CONFIG.choiceRock;
  if (type === "paper") return CONFIG.choicePaper;
  return CONFIG.choiceScissors;
};

const rpsFinger = (x, y, w, h, rot, nail) => {
  const r = h / 2;
  const t = rot ? ` transform="rotate(${rot} ${x + 4} ${y + r})"` : "";
  const nailEl = nail
    ? `<rect x="${x + w - 15}" y="${y + 3}" width="11" height="${h - 6}" rx="${(h - 6) / 2}" fill="#ffe9da" stroke="#c98a66" stroke-width="1.5"/>`
    : `<path d="M${x + w - 9} ${y + 4} Q${x + w - 4} ${y + r} ${x + w - 9} ${y + h - 4}" fill="none" stroke="#b9714a" stroke-opacity="0.5" stroke-width="2"/>`;
  return `<g${t}><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="url(#vlRpsSkinFinger)"/><path d="M${x + r} ${y + 4} H${x + w - r - 3}" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2.5"/>${nailEl}</g>`;
};

<rect x="19" y="45" width="6" height="66" rx="3" fill="#ffffff" opacity="0.3" stroke="none"/>`;

<ellipse cx="${50 + w * 0.45}" cy="90" rx="${w * 0.32}" ry="10" fill="#c9825a" opacity="0.22" stroke="none"/>
<path d="M60 48 Q${50 + w / 2} 42 ${44 + w} 50" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="3"/>`;

${rpsFinger(106, 40, 46, 18, 0, false)}

const handImgHtml = (type, side) => {
  const alt = handAltFor(type);
  const part = RPS_HAND_PARTS[type] || RPS_HAND_PARTS.rock;
  return `<svg class="rps-hand-img" viewBox="0 0 200 140" role="img" aria-label="${alt}" focusable="false"><g stroke="#8c4f2f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">${rpsArm(side === "cpu" ? "cpu" : "you")}${part}</g></svg>`;
};

const pickCpuBiased = (player) => {
  const r = Math.random();
  const winForPlayer = { rock: "scissors", paper: "rock", scissors: "paper" };
  const loseForPlayer = { rock: "paper", paper: "scissors", scissors: "rock" };
  const favor = CONFIG.cpuFavorPlayer;
  if (r < favor) return winForPlayer[player];
  if (r < favor + 0.22) return player;
  return loseForPlayer[player];
};

@keyframes vlRpsFadeIn {
  from {

  to {
    opacity: 1;
  }
}

@keyframes vlRpsFadeOut {
  from {
    opacity: 1;
  }
  to {
    opacity: 0;
  }
}

@keyframes vlRpsPanelIn {
  from {
    opacity: 0;

    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes vlRpsPanelOut {
  from {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  to {
    opacity: 0;
    transform: translateY(1em) scale(0.94);
  }
}

@keyframes vlRpsCouponIn {
  from {
    opacity: 0;

  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes vlRpsToastIn {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes vlRpsHandIdle {
  from {
    transform: translateY(0) rotate(-2deg);
  }
  to {
    transform: translateY(-0.3em) rotate(2deg);
  }
}

@keyframes vlRpsHandPump {
  0% {
    transform: rotate(0deg);
  }
  35% {
    transform: rotate(-26deg) translateY(-0.4em);
  }
  75% {
    transform: rotate(4deg) translateY(0.15em);
  }
  100% {
    transform: rotate(0deg);
  }
}

@keyframes vlRpsHandStrike {
  0% {
    transform: rotate(-20deg) scale(0.9);
    opacity: 0.7;
  }
  55% {
    transform: rotate(3deg) scale(1.08);
    opacity: 1;
  }
  100% {
    transform: rotate(0deg) scale(1);
    opacity: 1;
  }
}

@keyframes vlRpsHandWinner {
  0% {
    transform: scale(1);
  }
  40% {
    transform: scale(1.14) translateY(-0.3em);
  }
  100% {
    transform: scale(1.06);
  }
}

@keyframes vlRpsHandLoser {
  0% {
    transform: rotate(0deg);
    opacity: 1;
  }
  100% {

    opacity: 0.55;
  }
}

  0% {
    opacity: 0;
    transform: scale(0.6);
  }
  35% {
    opacity: 1;
    transform: scale(1.05);
  }
  100% {
    opacity: 0.7;
    transform: scale(1);
  }
}

  75% {

  }
  100% {

    transform: translateX(-50%) scale(1.25);
  }

    opacity: 0;

  30% {

  let audioCtx = null;
  let noiseBuf = null;

  const SFX = {
    tap: [[660, 0.08, "triangle", 0.12, 880, 0]],
    pump: [[150, 0.16, "sine", 0.4, 70, 0], [2200, 0.05, "noise", 0.08, 0, 0]],
    clash: [[2600, 0.18, "noise", 0.22, 0, 0], [320, 0.14, "triangle", 0.2, 140, 0], [980, 0.08, "square", 0.05, 620, 0]],
    win: [[523, 0.12, "triangle", 0.2, 0, 0], [659, 0.12, "triangle", 0.2, 0, 0.09], [784, 0.24, "triangle", 0.22, 0, 0.18]],
    lose: [[392, 0.2, "sawtooth", 0.08, 330, 0], [294, 0.32, "sawtooth", 0.08, 220, 0.17]],
    draw: [[440, 0.1, "sine", 0.16, 0, 0], [440, 0.14, "sine", 0.16, 0, 0.13]],
    matchWin: [[523, 0.14, "triangle", 0.2, 0, 0], [659, 0.14, "triangle", 0.2, 0, 0.12], [784, 0.14, "triangle", 0.2, 0, 0.24], [1047, 0.45, "triangle", 0.24, 0, 0.36], [1568, 0.4, "sine", 0.06, 0, 0.36]],
    matchLose: [[330, 0.25, "triangle", 0.16, 300, 0], [262, 0.25, "triangle", 0.16, 240, 0.22], [196, 0.5, "triangle", 0.16, 160, 0.44]],
    copy: [[880, 0.07, "sine", 0.16, 0, 0], [1320, 0.12, "sine", 0.16, 0, 0.07]]
  };

  const getAudio = () => {
    if (!audioCtx) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        audioCtx = new AC();
      } catch (e) {
        return null;
      }
    }
    if (audioCtx.state === "suspended") {
      audioCtx.resume().catch(() => {});
    }
    return audioCtx;
  };

  const getNoise = (ac) => {
    if (noiseBuf) return noiseBuf;
    noiseBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.4), ac.sampleRate);
    const data = noiseBuf.getChannelData(0);
    for (let i = 0; i < data.length; i += 1) {
      data[i] = Math.random() * 2 - 1;
    }
    return noiseBuf;
  };

  const playSfx = (name) => {
    const ac = getAudio();
    if (!ac || !SFX[name]) return;
    try {
      const now = ac.currentTime;
      SFX[name].forEach(([freq, dur, wave, vol, to, at]) => {
        const t = now + at;
        const gain = ac.createGain();
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(vol, t + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        gain.connect(ac.destination);
        if (wave === "noise") {
          const src = ac.createBufferSource();
          const filter = ac.createBiquadFilter();
          src.buffer = getNoise(ac);
          filter.type = "bandpass";
          filter.frequency.setValueAtTime(freq, t);
          src.connect(filter);
          filter.connect(gain);
          src.start(t);
          src.stop(t + dur + 0.02);
          return;
        }
        const osc = ac.createOscillator();
        osc.type = wave;
        osc.frequency.setValueAtTime(freq, t);
        if (to) osc.frequency.exponentialRampToValueAtTime(to, t + dur);
        osc.connect(gain);
        osc.start(t);
        osc.stop(t + dur + 0.02);
      });
    } catch (e) {}
  };

  const labelForChoice = (c) => {
    if (c === "rock") return CONFIG.choiceRock;
    if (c === "paper") return CONFIG.choicePaper;

  };

  const decide = (player, cpu) => {
    if (player === cpu) return "draw";
    if (
      (player === "rock" && cpu === "scissors") ||

  const panel = root.querySelector(".rps-panel");

  const roundBanner = root.querySelector("#rps-round-banner");

  const resultBadge = root.querySelector("#rps-result-badge");

  const setBattleHands = (you, cpu) => {

  const syncScoreboard = () => {

    const colors = ["#ffd84a", "#5ee08a", "#4d9fff", "#ff6b8b", "#ffffff", "#ff9a4d"];
    for (let i = 0; i < count; i += 1) {
      const s = document.createElement("span");
      const a = Math.random() * Math.PI * 2;
      const d = spread * (0.45 + Math.random() * 0.55);
      s.className = "rps-spark";
      s.style.setProperty("--x", `${xPct}%`);
      s.style.setProperty("--y", `${yPct}%`);
      s.style.setProperty("--dx", `${(Math.cos(a) * d).toFixed(2)}em`);
      s.style.setProperty("--dy", `${(Math.sin(a) * d + fall).toFixed(2)}em`);
      s.style.setProperty("--r", `${Math.round(Math.random() * 720 - 360)}deg`);
      s.style.setProperty("--c", colors[i % colors.length]);
      s.style.setProperty("--t", `${(0.8 + Math.random() * 0.6).toFixed(2)}s`);
      s.style.setProperty("--d", `${(Math.random() * 0.12).toFixed(2)}s`);
      s.addEventListener("animationend", () => s.remove(), { once: true });
      layer.appendChild(s);
    }
  };

  const resetMatch = () => {

  root.querySelector("#rps-pick-vis-rock").innerHTML = handImgHtml("rock", "you");

  const runRound = (player, cpu) => {
    resultYouHand.innerHTML = handImgHtml(player, "you");
    resultCpuHand.innerHTML = handImgHtml(cpu, "cpu");
    resultYouName.textContent = labelForChoice(player);
    resultCpuName.textContent = labelForChoice(cpu);
    resultScoreline.textContent = `${CONFIG.labelYou} ${scoreYou} — ${scoreCpu} ${CONFIG.labelComputer}`;
    couponToast.dataset.state = "close";
    couponToast.textContent = "";
    root.dataset.matchOver = "true";
    if (scoreYou >= winTo) {
      root.dataset.matchWinner = "you";
      resultMsg.textContent = CONFIG.msgMatchWin;
      couponCodeEl.textContent = CONFIG.couponCode;
      couponEl.dataset.state = "open";
      resultBadge.dataset.state = "open";
      root.dataset.outcome = "win";
      playSfx("matchWin");
      burst(fxLayer, 50, 18, 40, 14, 6);
      later(() => burst(fxLayer, 25, 30, 20, 10, 8), 350);
      later(() => burst(fxLayer, 75, 30, 20, 10, 8), 600);
    } else {
      root.dataset.matchWinner = "cpu";
      resultMsg.textContent = CONFIG.msgMatchLose;
      couponEl.dataset.state = "close";
      resultBadge.dataset.state = "close";
      root.dataset.outcome = "lose";
      playSfx("matchLose");
    }
    root.dataset.state = "result";
    root.dataset.rpsPhase = "idle";
    panel.scrollTop = 0;
    resetPickerLock();
  };

  const finishRound = (player, cpu, outcome) => {
    if (outcome === "win") {
      scoreYou += 1;
      bumpScore(scoreYouEl);
    }
    if (outcome === "lose") {
      scoreCpu += 1;
      bumpScore(scoreCpuEl);
    }
    syncScoreboard();
    root.dataset.outcome = outcome;
    root.dataset.rpsPhase = "done";
    if (outcome === "win") roundBanner.textContent = CONFIG.msgRoundWin;
    else if (outcome === "lose") roundBanner.textContent = CONFIG.msgRoundLose;
    else roundBanner.textContent = CONFIG.msgRoundDraw;
    roundBanner.dataset.state = "open";
    playSfx(outcome);
    if (outcome === "win") burst(arena, 28, 62, 22, 6, 1);
    const over = scoreYou >= winTo || scoreCpu >= winTo;
    if (over) {
      later(() => runRound(player, cpu), 1600);
    } else {
      later(startRound, 1500);
    }
  };

  const copyCoupon = () => {
    const code = CONFIG.couponCode;
    const doneOk = () => {
      couponToast.textContent = CONFIG.copyCouponOk;
      couponToast.dataset.state = "open";
      playSfx("copy");
    };
    const doneFail = () => {
      couponToast.textContent = CONFIG.copyCouponFail;
      couponToast.dataset.state = "open";
    };
    const legacyCopy = () => {
      const ta = document.createElement("textarea");
      ta.value = code;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      try {
        if (document.execCommand("copy")) doneOk();
        else doneFail();
      } catch (e) {
        doneFail();
      }
      document.body.removeChild(ta);
    };
    couponToast.dataset.state = "close";
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(doneOk).catch(legacyCopy);
    } else {
      legacyCopy();
    }
  };

  const onKey = (e) => {
    if (e.key === "Escape") closeGame();
  };

  const closeGame = () => {
    if (panel.dataset.state === "closing") return;
    timers.forEach((id) => window.clearTimeout(id));
    timers.clear();
    document.removeEventListener("keydown", onKey);
    panel.dataset.state = "closing";
    backdrop.dataset.state = "closing";
    const onPanelEnd = (e) => {
      if (e.target !== panel) return;
      panel.removeEventListener("animationend", onPanelEnd);
      root.remove();
      styleEl.remove();
      if (audioCtx) audioCtx.close().catch(() => {});
    };
    panel.addEventListener("animationend", onPanelEnd);
  };

  choiceBtns.forEach((btn) => {
    btn.addEventListener("click", () => {
      if (btn.getAttribute("data-locked") === "true") return;
      choiceBtns.forEach((b) => {
        b.setAttribute("data-locked", "true");
      });
      btn.setAttribute("data-picked", "true");
      const player = btn.getAttribute("data-choice");
      const cpu = pickCpuBiased(player);
      const outcome = decide(player, cpu);
      playSfx("tap");
      root.dataset.rpsPhase = "shake";
      for (let i = 1; i < CONFIG.countWords.length; i += 1) {
        later(() => playSfx("pump"), i * CONFIG.pumpMs - CONFIG.pumpMs * 0.25);
      }
      later(() => {
        setBattleHands(player, cpu);
        root.dataset.rpsPhase = "reveal";
        playSfx("clash");
        later(() => finishRound(player, cpu, outcome), 550);
      }, CONFIG.pumpMs * CONFIG.countWords.length);
    });
  });

  againBtn.addEventListener("click", () => {
    playSfx("tap");
    root.dataset.outcome = "";
    resetMatch();
    root.dataset.state = "play";
    panel.scrollTop = 0;
    startRound();
  });

  exitBtn.addEventListener("click", closeGame);
  closeBtn.addEventListener("click", closeGame);
  backdrop.addEventListener("click", closeGame);
  document.addEventListener("keydown", onKey);

  document.body.appendChild(root);
  try {
    const _vli = "<%VLSendImpressionFunc%>";
    if (_vli.indexOf("<%") === -1) {
      new Function(_vli)();
    }
  } catch (e) {}
}

initVlRockPaperScissors();
  </script>
</body>

</html>
