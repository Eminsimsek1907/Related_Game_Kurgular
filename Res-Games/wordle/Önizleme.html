const copyText = async (text) => {

    ta.setAttribute("readonly", "");
    ta.className = "wordle-copy-temp";
    root.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    const ok = document.execCommand("copy");
    ta.remove();
    if (ok) return true;
  } catch {}
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    return false;
  }
};
const evaluateGuess = (guess, solution) => {
  const result = Array(COL_COUNT).fill("absent");
  const sol = [...solution];
  const g = [...guess];
  for (let i = 0; i < COL_COUNT; i++) {
    if (g[i] === sol[i]) {
      result[i] = "correct";
      sol[i] = "";
      g[i] = null;
    }
  }
  for (let i = 0; i < COL_COUNT; i++) {
    if (g[i] === null) continue;
    const j = sol.indexOf(g[i]);
    if (j !== -1) {
      result[i] = "present";
      sol[j] = "";
    }
  }
  return result;
};

  const pool = exclude

  if (pool.length === 0) return source[0];
  return pool[Math.floor(Math.random() * pool.length)];

const updateKeyboard = () => {
  const best = {};
  gameState.guesses.forEach((word) => {
    const ev = evaluateGuess(word, gameState.solution);
    for (let i = 0; i < COL_COUNT; i++) {
      const ch = word[i];
      const res = ev[i];
      const prev = best[ch] != null ? KEY_RANK[best[ch]] : -1;
      if (KEY_RANK[res] >= prev) best[ch] = res;
    }
  });
  root.querySelectorAll(".wordle-key").forEach((btn) => {
    const k = btn.dataset.key;
    if (k === "ENTER" || k === "BACK") return;
    const st = best[k];
    if (!st) {
      btn.dataset.state = "";
      return;
    }
    const cur = btn.dataset.state;
    if (!cur || KEY_RANK[st] > KEY_RANK[cur]) btn.dataset.state = st;
  });
};

const renderBoard = () => {

      }

const runFlipRow = (r, word, ev, onDone) => {
  clearRowAnimationClasses(r);
  for (let c = 0; c < COL_COUNT; c++) {
    const tile = getTile(r, c);
    const back = tile.querySelector(".wordle-tile-back");
    back.textContent = word[c];
    back.className = "wordle-tile-back wordle-tile-back--" + ev[c];
    tile.dataset.phase = "fill";
    const front = tile.querySelector(".wordle-tile-front");
    front.textContent = word[c];
    tile.classList.add("wordle-flip", "wordle-flip-d" + c);
    SOUNDS.flip(c, ev[c]);
  }
  const last = getTile(r, COL_COUNT - 1);
  const inner = last.querySelector(".wordle-tile-inner");
  let finished = false;
  const finish = () => {
    if (finished) return;
    finished = true;
    for (let c = 0; c < COL_COUNT; c++) {
      const tile = getTile(r, c);
      tile.classList.remove(
        "wordle-flip",
        "wordle-flip-d0",
        "wordle-flip-d1",
        "wordle-flip-d2",
        "wordle-flip-d3",
        "wordle-flip-d4"
      );
      updateTile(r, c, word[c], "submitted", ev[c]);
    }
    updateKeyboard();
    onDone();
  };
  inner.addEventListener(
    "animationend",
    (e) => {
      if (e.animationName === "wordle-tile-flip") finish();
    },
    { once: true }
  );
  setTimeout(finish, FLIP_DURATION_MS + FLIP_STAGGER_MS * (COL_COUNT - 1) + 100);
};

const recordWin = (n) => {

const buildShareText = () => {
  const lines = [];

const startNewRound = (exclude) => {
  gameState = createGameState();
  if (exclude) {
    gameState.solution = pickRandomWord(exclude);
  }
  inputLocked = false;
  buildBoard();
  buildKeyboard();
  renderBoard();
};
const submitGuess = () => {
  if (inputLocked || currentStep !== 2) return;
  if (gameState.gameStatus !== "playing") return;
  const row = gameState.guesses.length;
  if (gameState.currentGuess.length !== COL_COUNT) {
    shakeRow(row);
    SOUNDS.invalid();
    showToast("Yetersiz harf");
    return;
  }
  const w = gameState.currentGuess;
  if (!ALLOWED_WORD_SET.has(w)) {
    shakeRow(row);
    SOUNDS.invalid();
    showToast("Bu kelime listede yok");
    return;
  }
  const ev = evaluateGuess(w, gameState.solution);
  inputLocked = true;
  gameState.guesses.push(w);
  gameState.currentGuess = "";
  runFlipRow(row, w, ev, () => {
    const won = ev.every((x) => x === "correct");
    if (won) {
      gameState.gameStatus = "won";
      recordWin(gameState.guesses.length);
      runWinWave(row);
      SOUNDS.win();
      launchConfetti();
      setTimeout(() => openStep3("win"), 1100);
    } else if (gameState.guesses.length >= ROW_COUNT) {
      gameState.gameStatus = "lost";
      recordLoss();
      SOUNDS.lose();
      showToast(gameState.solution);
      setTimeout(() => openStep3("lose"), 1300);
    }
    inputLocked = false;
  });
};
const handleKey = (k) => {
  if (inputLocked || currentStep !== 2) return;
  if (gameState.gameStatus !== "playing") return;
  pulseKey(k);
  if (k === "BACK") {
    if (gameState.currentGuess.length > 0) {
      gameState.currentGuess = gameState.currentGuess.slice(0, -1);
      SOUNDS.back();
      renderBoard();
    }
    return;
  }
  if (k === "ENTER") {
    submitGuess();
    return;
  }
  if (gameState.currentGuess.length < COL_COUNT) {
    gameState.currentGuess += k;
    SOUNDS.key();
    renderBoard();
    const idx = gameState.currentGuess.length - 1;
    triggerPop(gameState.guesses.length, idx);
  }
};
const onPhysicalKey = (e) => {
  if (!root || root.dataset.state !== "open") return;
  if (e.key === "Escape") {
    closePopup();
    return;
  }
  if (currentStep !== 2) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (gameState.gameStatus !== "playing" || inputLocked) return;
  const active = document.activeElement;
  if (active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA"))
    return;
  const key = e.key;
  if (key === "Enter") {
    e.preventDefault();
    submitGuess();
    return;
  }
  if (key === "Backspace") {
    e.preventDefault();
    handleKey("BACK");
    return;
  }
  if (key.length !== 1) return;
  const ch = key.toLocaleUpperCase("tr-TR");
  if (ALLOWED_KEYS.has(ch)) {
    e.preventDefault();
    handleKey(ch);
  }
};
const closePopup = () => {
  if (root.dataset.state !== "open") return;
  root.dataset.state = "closing";
  document.removeEventListener("keydown", onPhysicalKey);
  clearTimeout(showToast._t);
  let done = false;
  const finish = () => {
    if (done) return;
    done = true;
    root.removeEventListener("animationend", onEnd);
    root.remove();
    const st = document.getElementById(CONFIG.styleId);
    if (st) st.remove();
    stopAudio();
  };
  const onEnd = (e) => {
    if (e.target !== root) return;
    if (e.animationName !== "wordle-popup-out") return;
    finish();
  };
  root.addEventListener("animationend", onEnd);
  setTimeout(finish, 280);
};

  top: 0;
  left: 0;
  opacity: 0;
  pointer-events: none;
}
@media (pointer: coarse) {
  #wordlePopupRoot .wordle-popup-x {
    width: 2.5rem;
    height: 2.5rem;
  }
  #wordlePopupRoot .wordle-icon-btn {
    width: 2.75rem;
    height: 2.75rem;
    min-width: 2.75rem;
    min-height: 2.75rem;
  }
}
@media (hover: hover) and (pointer: fine) {
  #wordlePopupRoot .wordle-popup-x:hover {
    background: var(--w-surface-hover);
  }
  #wordlePopupRoot .wordle-icon-btn:hover {
    transform: translateY(-2px);
  }
  #wordlePopupRoot .wordle-key:hover {
    filter: brightness(1.055);
  }
  #wordlePopupRoot[data-theme="dark"] .wordle-key:hover {
    filter: brightness(1.1);
  }
  #wordlePopupRoot .wordle-btn--primary:hover {
    filter: brightness(1.05);
  }
  #wordlePopupRoot .wordle-btn--ghost:hover {
    background: var(--w-surface);
  }
}
@media (max-width: 767px) {
  #wordlePopupRoot .wordle-step2-bar {
    padding-inline: max(10px, env(safe-area-inset-left));
  }
}
@media (min-width: 480px) {
  #wordlePopupRoot .wordle-popup-panel {
    width: min(calc(100vw - 32px), 580px);
  }
  #wordlePopupRoot {
    --w-cell: clamp(36px, min(11vw, 10vmin), 56px);
    --w-key-h: clamp(40px, 9vmin, 58px);
    --w-key-min: 1.5rem;
    padding: calc(12px + env(safe-area-inset-top, 0)) calc(16px + env(safe-area-inset-right, 0)) calc(12px + env(safe-area-inset-bottom, 0)) calc(16px + env(safe-area-inset-left, 0));
  }
  #wordlePopupRoot .wordle-popup-body {
    padding: 4px 16px 14px;
  }
  #wordlePopupRoot .wordle-popup-head {
    padding: 10px 14px 4px;
  }
}
@media (min-width: 768px) {
  #wordlePopupRoot .wordle-popup-panel {
    width: min(calc(100vw - 48px), 620px);
    max-height: min(calc(100dvh - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)), 920px);
  }
  #wordlePopupRoot {
    --w-cell: clamp(44px, min(9vw, 7.2vmin), 62px);
    --w-key-h: clamp(44px, 7.4vmin, 60px);
    --w-key-min: 1.65rem;
    --w-key-wide-flex: 1.55;
  }
  #wordlePopupRoot .wordle-popup-body {
    padding: 6px 22px 20px;
  }
}
@media (min-width: 1024px) {
  #wordlePopupRoot .wordle-popup-panel {
    width: min(calc(100vw - 56px), 640px);
  }
}

const wireEvents = () => {
  root.querySelector("#wordleBtnStep1").addEventListener(
    "click",
    () => {
      try {
        const _vlc = "<%VLSendClickFunc%>";
        if (_vlc.indexOf("<%") === -1) {
          new Function(_vlc)();
        }
      } catch {}
      saveHowto();
      SOUNDS.start();
      startNewRound(null);
      goStep(2);
    },
    { once: true }
  );
  root.querySelector("#wordleBtnSound").addEventListener("click", () => {
    soundOn = !soundOn;
    if (!soundOn) stopAudio();
    applySound();
    SOUNDS.key();
  });
  root.querySelector("#wordleBtnCopy").addEventListener("click", async (e) => {
    const btn = e.currentTarget;
    const ok = await copyText(root.querySelector("#wordleRewardCode").textContent);
    if (ok) {
      SOUNDS.copy();
      btn.textContent = "Kopyalandı ✓";
      btn.dataset.state = "done";
      showToast("İndirim kodu kopyalandı");
    } else {
      showToast("Kopyalanamadı, kodu elle seçebilirsin");
    }
  });
  root.querySelector("#wordleBtnTheme").addEventListener("click", () => {
    theme = theme === "dark" ? "light" : "dark";
    saveTheme();
    applyTheme();
  });
  root.querySelector("#wordleBtnShare").addEventListener("click", async () => {
    const ok = await copyText(buildShareText());
    if (ok) SOUNDS.copy();
    showToast(ok ? "Panoya kopyalandı" : "Kopyalanamadı");
  });
  root.querySelector("#wordleBtnNewWord").addEventListener("click", () => {
    const ex = gameState ? gameState.solution : null;
    startNewRound(ex);
    goStep(2);
  });
  root.querySelector("#wordleBtnCloseEnd").addEventListener("click", closePopup);
  document.addEventListener("keydown", onPhysicalKey);
};
function initWordlePopup() {
  injectStyles();
  stats = loadStats();
  theme = loadTheme();
  document.body.appendChild(buildDom());
  applyTheme();
  applySound();
  gameState = createGameState();
  goStep(1);
  wireEvents();
  try {
    const _vli = "<%VLSendImpressionFunc%>";
    if (_vli.indexOf("<%") === -1) {
      new Function(_vli)();
    }
  } catch {}
}
initWordlePopup();
})();
